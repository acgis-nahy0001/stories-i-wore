<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Item form · Stories I Wore Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/pages/admin-item-form.js"></script>
</head>
<body class="admin is-checking">
  <div class="admin-layout">
    <aside class="sidebar">
      <span class="logo">Stories I Wore<span>.</span></span>
      <span class="sidebar-label">Admin</span>
      <nav aria-label="Admin">
        <a href="index.html">Dashboard</a>
        <a href="items.html" aria-current="page">Items</a>
        <a href="../index.html" target="_blank" rel="noopener">View the shop ↗</a>
      </nav>
      <button type="button" class="logout" data-logout>Log out</button>
    </aside>

    <main class="admin-main">
      <a href="items.html">← Back to items</a>
      <div class="admin-head"><h1 id="form-title">Add item</h1></div>
      <div class="messages" id="messages"></div>

      <form class="card item-form" id="item-form" novalidate>
        <section style="display:flex;flex-direction:column;gap:14px">
          <h2 style="font-family:var(--body);font-weight:700;font-size:18px">Photos</h2>
          <div class="photo-list" id="existing-photos"></div>
          <div class="drop-zone">
            <label class="btn btn-secondary" for="photos">Choose photos</label>
            <input class="visually-hidden" type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple>
            <span class="hint" style="color:var(--muted);font-size:14px">1 to 6 photos · JPEG, PNG or WebP · under 5 MB each. The first photo is the main one.</span>
          </div>
          <div class="photo-list" id="new-photos"></div>
          <p class="photo-error" id="photos-error" role="alert"></p>
        </section>

        <section class="form-grid">
          <label class="field wide" data-field="title">Title
            <input name="title" maxlength="120" required>
          </label>
          <label class="field" data-field="category_id">Category
            <select name="category_id" required><option value="">Choose…</option></select>
          </label>
          <label class="field" data-field="size">Size
            <input name="size" maxlength="30" placeholder="e.g. M, 8, One size" required>
          </label>
          <label class="field" data-field="condition">Condition
            <select name="condition" required>
              <option value="">Choose…</option>
              <option>New with tags</option>
              <option>Like new</option>
              <option>Good</option>
              <option>Fair</option>
            </select>
          </label>
          <label class="field" data-field="price">Price (CAD)
            <input name="price" inputmode="decimal" placeholder="e.g. 25" required>
          </label>
          <label class="field wide" data-field="measurements">Measurements
            <input name="measurements" maxlength="200" placeholder="e.g. Bust 36 in, waist 30 in, length 45 in">
          </label>
          <label class="field wide" data-field="description">Description
            <textarea name="description" maxlength="2000" placeholder="Fabric, fit, and any marks or repairs worth knowing"></textarea>
          </label>
          <label class="field wide" data-field="origin">Where it's from <span class="hint">Optional, e.g. "Found in Kathmandu, Nepal"</span>
            <input name="origin" maxlength="120">
          </label>
          <label class="field" data-field="status">Status
            <select name="status">
              <option value="available">Available</option>
              <option value="reserved">Reserved</option>
              <option value="sold">Sold</option>
            </select>
          </label>
        </section>

        <div class="form-actions">
          <button class="btn" type="submit" id="save">Save item</button>
          <a class="btn btn-secondary" href="items.html">Cancel</a>
          <div class="delete-area" id="delete-area"></div>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
