<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard · Stories I Wore Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/pages/admin-dashboard.js"></script>
</head>
<body class="admin is-checking">
  <div class="admin-layout">
    <aside class="sidebar">
      <span class="logo">Stories I Wore<span>.</span></span>
      <span class="sidebar-label">Admin</span>
      <nav aria-label="Admin">
        <a href="index.html" aria-current="page">Dashboard</a>
        <a href="items.html">Items</a>
        <a href="../index.html" target="_blank" rel="noopener">View the shop ↗</a>
      </nav>
      <button type="button" class="logout" data-logout>Log out</button>
    </aside>

    <main class="admin-main">
      <div class="admin-head">
        <h1>Your closet today</h1>
        <a class="btn" href="item-form.html">+ Add item</a>
      </div>
      <div class="messages" id="messages"></div>

      <section class="stats" aria-label="Counts">
        <a class="card stat" href="items.html?status=available"><span class="chip chip-available">Available</span><span class="number" id="count-available">–</span><span class="label">pieces on the Shop</span></a>
        <a class="card stat" href="items.html?status=reserved"><span class="chip chip-reserved">Reserved</span><span class="number" id="count-reserved">–</span><span class="label">waiting on hand-off</span></a>
        <a class="card stat" href="items.html?status=sold"><span class="chip chip-sold">Sold</span><span class="number" id="count-sold">–</span><span class="label">new homes found</span></a>
        <div class="card stat"><span class="chip chip-reserved">New orders</span><span class="number" id="count-orders">–</span><span class="label">Order management arrives in Iteration II</span></div>
      </section>

      <section class="card recent">
        <div class="admin-head"><h2>Recently listed</h2><a href="items.html" style="margin-left:auto;font-weight:700">All items →</a></div>
        <div class="recent-grid" id="recent"></div>
      </section>
    </main>
  </div>
</body>
</html>
