<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Items · Stories I Wore Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/pages/admin-items.js"></script>
</head>
<body class="admin is-checking">
  <div class="admin-layout">
    <aside class="sidebar">
      <span class="logo">Stories I Wore<span>.</span></span>
      <span class="sidebar-label">Admin</span>
      <nav aria-label="Admin">
        <a href="index.html">Dashboard</a>
        <a href="items.html" aria-current="page">Items</a>
        <a href="../index.html" target="_blank" rel="noopener">View the shop ↗</a>
      </nav>
      <button type="button" class="logout" data-logout>Log out</button>
    </aside>

    <main class="admin-main">
      <div class="admin-head">
        <h1>Items</h1>
        <span id="total" style="color: var(--muted)"></span>
        <a class="btn" href="item-form.html">+ Add item</a>
      </div>
      <div class="messages" id="messages"></div>

      <form class="toolbar" id="filters" aria-label="Filter items">
        <label class="field grow">Search
          <input type="search" id="search" placeholder="Search by title" autocomplete="off">
        </label>
        <label class="field">Status
          <select id="status-filter">
            <option value="">All</option>
            <option value="available">Available</option>
            <option value="reserved">Reserved</option>
            <option value="sold">Sold</option>
          </select>
        </label>
      </form>

      <section class="card table-wrap">
        <table>
          <thead>
            <tr><th>Piece</th><th>Category</th><th>Size</th><th>Price</th><th>Status</th><th><span class="visually-hidden">Actions</span></th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="loading">Loading items…</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
